apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: ci-cd-tasks
spec:
  workspaces:
    - name: source
  steps:
    # --- TUGAS PENGUJIAN (Unit Test dengan Nose) ---
    - name: unit-tests
      image: python:3.9-slim
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/bash
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install nose
        nosetests -v --with-spec --spec-color

    # --- TUGAS PEMBERSIHAN (Cleanup) ---
    - name: cleanup
      image: alpine:latest
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/sh
        echo "Membersihkan sisa artefak build dan file temporer..."
        rm -rf __pycache__ .pytest_cache .coverage *.pyc
        # Jika menggunakan Node.js/Jest, hapus folder coverage
        # rm -rf coverage
